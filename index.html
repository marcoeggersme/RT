<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unterschrift_Auto</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 10px;
}

#infoBox {
    margin-bottom:15px;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

canvas {
    border: 2px solid #333;
    border-radius: 10px;
    touch-action: none;
}

button {
    margin: 10px;
    padding: 12px 20px;
    font-size: 16px;
}
</style>
</head>

<body>

<h2>Bitte unterschreiben</h2>

<div id="infoBox">
    <b>Datum:</b> <span id="datum"></span><br>
    <b>Klient:</b> <span id="klient"></span><br>
    <b>Leistung:</b> <span id="leistung"></span><br>
    <b>Einheit:</b> <span id="einheit"></span>
</div>

<canvas id="canvas" width="350" height="200"></canvas><br>

<button onclick="clearCanvas()">Löschen</button>
<button onclick="saveSignature()">Speichern</button>

<p id="result"></p>

<script>

// ===============================
// Debug
// ===============================
console.log("Script geladen");

// ===============================
// URL Parameter lesen
// ===============================
function getParam(name) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(name) || "";
}

// ===============================
// Canvas Setup
// ===============================
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let drawing = false;

// ===============================
// Position ermitteln
// ===============================
function getPos(e) {
    const rect = canvas.getBoundingClientRect();

    if (e.touches) {
        return {
            x: e.touches[0].clientX - rect.left,
            y: e.touches[0].clientY - rect.top
        };
    } else {
        return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
        };
    }
}

// ===============================
// Zeichenfunktionen
// ===============================
function start(e) {
    e.preventDefault();
    drawing = true;
    draw(e);
}

function stop(e) {
    drawing = false;
    ctx.beginPath();
}

function draw(e) {
    if (!drawing) return;

    e.preventDefault();

    const pos = getPos(e);

    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.strokeStyle = "black";

    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
}

    function onFormSubmit(e) {

  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName("Form Responses 1");
  const row = e.range.getRow();

  const datum = sheet.getRange(row, 1).getValue();
  const klient = sheet.getRange(row, 2).getValue();
  const leistung = sheet.getRange(row, 3).getValue();
  const einheit = sheet.getRange(row, 4).getValue();

  const url =
    "https://marcoeggersme.github.io/RT/index.html" +
    "?Datum=" + encodeURIComponent(datum) +
    "&Klient=" + encodeURIComponent(klient) +
    "&Leistung=" + encodeURIComponent(leistung) +
    "&Einheit=" + encodeURIComponent(einheit);

  // Link in Spalte Unterschrift_Link schreiben
  sheet.getRange(row, 6).setValue(url);
}

// ===============================
// Events
// ===============================
canvas.addEventListener("mousedown", start);
canvas.addEventListener("mouseup", stop);
canvas.addEventListener("mousemove", draw);

canvas.addEventListener("touchstart", start, { passive: false });
canvas.addEventListener("touchend", stop);
canvas.addEventListener("touchmove", draw, { passive: false });

// ===============================
// Canvas löschen
// ===============================
function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// ===============================
// Seite geladen → Daten anzeigen
// ===============================
window.onload = function() {

    document.getElementById("datum").innerText =
        getParam("datum") || getParam("Datum");

    document.getElementById("klient").innerText =
        getParam("klient") || getParam("Klient");

    document.getElementById("leistung").innerText =
        getParam("leistung") || getParam("Leistung");

    document.getElementById("einheit").innerText =
        getParam("einheit") || getParam("Einheit");

};

// ===============================
// Speichern + Upload + Rückgabe
// ===============================
function saveSignature() {

    const dataURL = canvas.toDataURL("image/png");

    const timestamp = new Date().getTime();
    const fileName = "signatur_" + timestamp + ".png";

    fetch("https://script.google.com/macros/s/AKfycbwJzRMx7LIV2KRtuV0nubaHlhySkLPh7Vvuxw_IxwBY8UmpuUsbEkmdiXOGQy8TQi00cQ/exec", {
        method: "POST",
        body: JSON.stringify({
            image: dataURL,
            fileName: fileName,
            datum: getParam("Datum"),
            klient: getParam("Klient"),
            leistung: getParam("Leistung"),
            einheit: getParam("Einheit")
        })
    })
    .then(response => response.json())
    .then(data => {

        if (data.status === "ok") {

            const returnUrl = getParam("returnUrl");

            // 🔥 Automatische Rückgabe
            if (returnUrl) {
                window.location.href = returnUrl + "?signature=" + encodeURIComponent(data.url);
            } else {
                document.getElementById("result").innerHTML =
                    "<b>✔ Gespeichert!</b><br>" +
                    "<a href='" + data.url + "' target='_blank'>Signatur öffnen</a>";
            }

        } else {
            document.getElementById("result").innerHTML =
                "Fehler: " + data.message;
        }

    })
    .catch(err => {
        document.getElementById("result").innerHTML =
            "Upload fehlgeschlagen";
    });
}

</script>

</body>
</html>
