<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body{
  font-family: Arial, sans-serif;
  margin:0;
  padding:20px;
  background:#ffffff;
}

/* HEADLINE */
h2{
  cursor:pointer;
}

/* FORM */
.form{
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* EINHEITLICHE FELDER */
select,input,textarea{
  width:100%;
  height:52px;
  padding:0 14px;
  border-radius:12px;
  border:1px solid #d0e8d5;
  font-size:16px;
  background:#eaf7ec;
  box-sizing:border-box;
}

textarea{
  height:80px;
  padding-top:12px;
}

/* Datum optisch wie Button */
input[type="date"]{
  appearance:none;
  -webkit-appearance:none;
  text-align:center;
  font-weight:500;
}

/* BUTTONS */
.btn-row{
  display:flex;
  gap:10px;
}

button{
  flex:1;
  height:52px;
  border-radius:12px;
  border:none;
  font-size:16px;
  font-weight:bold;
}

.btn-clear{
  background:#d6eaf8;
}

.btn-save{
  background:#b7e4c7;
}

/* CANVAS */
canvas{
  width:100%;
  height:200px;
  border:2px solid #cfead6;
  border-radius:18px;
  background:#f6fbf7;
}

/* QUERFORMAT */
@media (orientation: landscape){
  .form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  textarea,
  canvas,
  .btn-row{
    grid-column:1 / span 2;
  }
}

/* OVERLAY */
#overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(255,255,255,0.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.horse{
  font-size:60px;
  animation:run 1s infinite alternate ease-in-out;
}

@keyframes run{
  from{transform:translateX(-10px);}
  to{transform:translateX(10px);}
}

.progress{
  width:220px;
  height:10px;
  background:#eee;
  border-radius:10px;
  margin:20px auto;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#95d5b2;
  transition:width .4s ease;
}

.status{
  font-size:16px;
  color:#555;
}

/* CONFIRM */
#confirm{
  display:none;
  text-align:center;
  margin-top:40px;
}
</style>
</head>

<body>

<div id="form">
  <h2 onclick="goHome()">Leistung erfassen</h2>

  <div class="form">
    <select id="klient"></select>
    <select id="leistung"></select>

    <input id="einheit" value="1">
    <input id="datum" type="date">

    <textarea id="notiz" placeholder="Notiz"></textarea>

    <canvas id="canvas"></canvas>

    <div class="btn-row">
      <button class="btn-clear" onclick="clearCanvas()">Löschen</button>
      <button class="btn-save" onclick="save()">Speichern</button>
    </div>
  </div>
</div>

<div id="confirm">
  <h2>Gespeichert</h2>
  <button onclick="goHome()">Zurück</button>
</div>

<!-- OVERLAY -->
<div id="overlay">
  <div style="text-align:center;">
    <div class="horse">🐎</div>

    <div class="progress">
      <div id="bar" class="progress-bar"></div>
    </div>

    <div id="status" class="status">Start...</div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwTDDFrZZ2d5nXFfPdQwtE-YOs88E1lwRjeHpM87R4kNf_fZriuH8-iBPEPPrtnQNO6Qw/exec";

/* INIT */
window.onload = function(){

  const d = new Date();
  const iso = d.toISOString().split("T")[0];
  document.getElementById("datum").value = iso;

  resizeCanvas();
  loadDropdowns();
};

/* CANVAS */
let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");
let drawing=false;

function resizeCanvas(){
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}
window.addEventListener("resize",resizeCanvas);

canvas.addEventListener("mousedown",e=>{
  drawing=true;
  ctx.beginPath();
  ctx.moveTo(e.offsetX,e.offsetY);
});

canvas.addEventListener("mousemove",e=>{
  if(!drawing)return;
  ctx.lineTo(e.offsetX,e.offsetY);
  ctx.stroke();
});

canvas.addEventListener("mouseup",()=>drawing=false);

function clearCanvas(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

/* DROPDOWN */
function loadDropdowns(){
  fetch(API_URL+"?t="+Date.now())
  .then(r=>r.json())
  .then(data=>{
    let k=document.getElementById("klient");
    let l=document.getElementById("leistung");

    k.innerHTML="<option value=''>Klient wählen</option>";
    data.klienten.forEach(v=>{
      let o=document.createElement("option");
      o.value=v;
      o.text=v;
      k.add(o);
    });

    l.innerHTML="";
    data.leistungen.forEach(v=>{
      let o=document.createElement("option");
      o.value=v;
      o.text=v;
      l.add(o);
    });

    l.value="Reittherapie";
  });
}

/* PROGRESS */
function setProgress(p,text){
  document.getElementById("bar").style.width=p+"%";
  document.getElementById("status").innerText=text;
}

/* SAVE */
function save(){

  let klient=document.getElementById("klient").value;
  let leistung=document.getElementById("leistung").value;

  if(!klient||!leistung){
    alert("Bitte auswählen");
    return;
  }

  document.getElementById("overlay").style.display="flex";

  setProgress(10,"Daten werden vorbereitet...");

  setTimeout(()=>{

    setProgress(40,"Signatur wird verarbeitet...");

    let signature=canvas.toDataURL();

    setTimeout(()=>{

      setProgress(70,"Übertragung läuft...");

      fetch(API_URL,{
        method:"POST",
        mode:"no-cors",
        body:JSON.stringify({
          klient,
          leistung,
          einheit:document.getElementById("einheit").value,
          datum:document.getElementById("datum").value,
          notiz:document.getElementById("notiz").value,
          signature
        })
      })
      .then(()=>{

        setProgress(100,"Fertig");

        setTimeout(()=>{
          document.getElementById("overlay").style.display="none";
          document.getElementById("form").style.display="none";
          document.getElementById("confirm").style.display="block";
        },400);

      })
      .catch(()=>{
        document.getElementById("overlay").style.display="none";
        alert("Fehler beim Speichern");
      });

    },300);

  },200);
}

/* HOME */
function goHome(){
  location.href = "index.html";
}
</script>

</body>
</html>
