<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leistung erfassen</title>

<style>
body {
    font-family: Arial;
    margin: 10px;
}

label {
    display: block;
    margin-top: 10px;
}

select, input, textarea, button {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    font-size: 16px;
}

/* SIGNATUR */
#signature {
    width: 100%;
    height: 200px;
    border: 2px solid #333;
    background: #fff;
    touch-action: none;
}

/* Querformat verbessern */
@media (orientation: landscape) {
    #signature {
        height: 300px;
    }
}

.btn-row {
    display: flex;
    gap: 10px;
}

button {
    flex: 1;
}
</style>
</head>

<body>

<h2>Leistung erfassen</h2>

<label>Klient</label>
<select id="klient"></select>

<label>Leistung</label>
<select id="leistung"></select>

<label>Einheit</label>
<input id="einheit">

<label>Notiz</label>
<textarea id="notiz"></textarea>

<label>Unterschrift</label>
<canvas id="signature"></canvas>

<div class="btn-row">
    <button onclick="clearCanvas()">Löschen</button>
    <button onclick="submitForm()">Speichern</button>
</div>

<script>

const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbybnJsJLpSy39x3GGX35f0V77IVxH2L0y_HxZhdeLNVFA7d8fYEXGOQjYyDEloUmWo7Ww/exec";

const canvas = document.getElementById("signature");
const ctx = canvas.getContext("2d");

let drawing = false;

/* =========================
   CANVAS FIX (KEIN VERZERR)
========================= */
function resizeCanvas() {
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();

    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;

    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
}

window.addEventListener("load", resizeCanvas);
window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", resizeCanvas);

/* =========================
   POSITION BERECHNUNG
========================= */
function getPos(e) {
    const rect = canvas.getBoundingClientRect();

    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    return {
        x: clientX - rect.left,
        y: clientY - rect.top
    };
}

/* =========================
   ZEICHNEN
========================= */
canvas.addEventListener("mousedown", start);
canvas.addEventListener("mousemove", draw);
canvas.addEventListener("mouseup", stop);
canvas.addEventListener("mouseleave", stop);

canvas.addEventListener("touchstart", start);
canvas.addEventListener("touchmove", draw);
canvas.addEventListener("touchend", stop);

function start(e) {
    drawing = true;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
}

function draw(e) {
    if (!drawing) return;

    e.preventDefault();

    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
}

function stop() {
    drawing = false;
}

/* =========================
   CLEAR
========================= */
function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}

/* =========================
   DATEN LADEN
========================= */
async function loadData() {
    const res = await fetch(WEBAPP_URL);
    const data = await res.json();

    const klient = document.getElementById("klient");
    const leistung = document.getElementById("leistung");

    data.klienten.forEach(k => {
        let opt = document.createElement("option");
        opt.value = k;
        opt.text = k;
        klient.appendChild(opt);
    });

    data.leistungen.forEach(l => {
        let opt = document.createElement("option");
        opt.value = l;
        opt.text = l;
        leistung.appendChild(opt);
    });
}

loadData();

/* =========================
   SUBMIT
========================= */
async function submitForm() {

    const payload = {
        klient: document.getElementById("klient").value,
        leistung: document.getElementById("leistung").value,
        einheit: document.getElementById("einheit").value,
        notiz: document.getElementById("notiz").value,
        signature: canvas.toDataURL("image/png"),
        datum: new Date().toISOString()
    };

    await fetch(WEBAPP_URL, {
        method: "POST",
        body: JSON.stringify(payload),
        headers: { "Content-Type": "application/json" }
    });

    alert("Gespeichert");

    clearCanvas();
}

</script>

</body>
</html>
