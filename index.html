<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<style>
body { font-family: Arial; padding: 20px; }

h2 {
  cursor: pointer;
  margin-bottom: 10px;
}

/* 🔥 Querformat Header kompakter */
@media (orientation: landscape) {
  body {
    padding: 10px;
  }
  h2 {
    font-size: 18px;
    margin-bottom: 5px;
  }
}

.form-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

select, input, textarea {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  box-sizing: border-box;
}

#einheit {
  text-align: center;
}

canvas {
  border: 1px solid #000;
  border-radius: 12px;
  width: 100%;
  height: 200px;
  touch-action: none;
  background: #fff;
}

/* 🔥 Button-Reihe */
.btn-row {
  display: flex;
  gap: 10px;
}

.btn-row button {
  flex: 1;
}

/* Querformat Layout */
@media (orientation: landscape) {
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  textarea {
    grid-column: span 2;
  }

  canvas {
    grid-column: span 2;
    height: 200px;
  }

  .btn-row {
    grid-column: span 2;
  }
}

#pageConfirm {
  display: none;
  text-align: center;
  margin-top: 40px;
}
</style>
</head>

<body>

<div id="pageForm">
  <h2 onclick="reloadDropdowns()">Leistung erfassen</h2>

  <div class="form-grid">

    <select id="klient"></select>
    <select id="leistung"></select>

    <input id="einheit" value="1">
    <input id="datum" type="date">

    <textarea id="notiz" placeholder="Notiz"></textarea>

    <canvas id="canvas"></canvas>

    <div class="btn-row">
      <button onclick="clearCanvas()">Unterschrift löschen</button>
      <button onclick="save()">Speichern</button>
    </div>

  </div>
</div>

<div id="pageConfirm">
  <h2>Gespeichert</h2>
  <button onclick="goHome()">Zurück zur Startseite</button>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycby5SUfqIxFdpsvu44jOJM98c9KgW3025-7MMNaSi9zPuzatqeOZEKXIUpm6dU8nOzGmow/exec";

let canvas, ctx;
let drawing = false;
let hasSigned = false;

/* =====================
   INIT
===================== */
window.onload = function () {

  loadDropdowns();

  document.getElementById("datum").valueAsDate = new Date();

  canvas = document.getElementById("canvas");
  ctx = canvas.getContext("2d");

  resizeCanvas();

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", draw);
  canvas.addEventListener("mouseup", end);
  canvas.addEventListener("mouseleave", end);

  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", draw, { passive: false });
  canvas.addEventListener("touchend", end);

  ["klient","leistung","einheit","datum","notiz"].forEach(id => {
    document.getElementById(id).addEventListener("change", saveState);
  });

  setTimeout(loadState, 300);
};

window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 150));

/* =====================
   DROPDOWNS + DEFAULT
===================== */
function loadDropdowns() {
  fetch(API_URL + "?t=" + new Date().getTime())
    .then(r => r.json())
    .then(data => {

      const klient = document.getElementById("klient");
      const leistung = document.getElementById("leistung");

      klient.innerHTML = "<option value=''>Klient wählen</option>";
      (data.klienten || []).forEach(k => {
        const opt = document.createElement("option");
        opt.value = k;
        opt.textContent = k;
        klient.appendChild(opt);
      });

      leistung.innerHTML = "<option value=''>Leistung wählen</option>";
      (data.leistungen || []).forEach(l => {
        const opt = document.createElement("option");
        opt.value = l;
        opt.textContent = l;

        // 🔥 DEFAULT
        if (l.toLowerCase() === "reittherapie") {
          opt.selected = true;
        }

        leistung.appendChild(opt);
      });

    });
}

function reloadDropdowns() {
  loadDropdowns();
}

/* =====================
   CANVAS
===================== */
function resizeCanvas() {
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();

  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;

  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

  if (localStorage.getItem("signature")) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
    img.src = localStorage.getItem("signature");
  }
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: x - rect.left, y: y - rect.top };
}

function start(e) {
  e.preventDefault();
  drawing = true;
  const pos = getPos(e);
  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y);
}

function draw(e) {
  if (!drawing) return;
  e.preventDefault();

  const pos = getPos(e);
  ctx.lineWidth = 3;
  ctx.lineCap = "round";

  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();

  hasSigned = true;
  saveState();
}

function end() {
  drawing = false;
}

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  hasSigned = false;
  localStorage.removeItem("signature");
}

/* =====================
   STATE
===================== */
function saveState() {
  const state = {
    klient: document.getElementById("klient").value,
    leistung: document.getElementById("leistung").value,
    einheit: document.getElementById("einheit").value,
    datum: document.getElementById("datum").value,
    notiz: document.getElementById("notiz").value
  };

  localStorage.setItem("formState", JSON.stringify(state));

  if (hasSigned) {
    localStorage.setItem("signature", canvas.toDataURL());
  }
}

function loadState() {
  const state = JSON.parse(localStorage.getItem("formState") || "{}");

  if (state.klient) document.getElementById("klient").value = state.klient;
  if (state.leistung) document.getElementById("leistung").value = state.leistung;
  if (state.einheit) document.getElementById("einheit").value = state.einheit;
  if (state.datum) document.getElementById("datum").value = state.datum;
  if (state.notiz) document.getElementById("notiz").value = state.notiz;
}

function clearState() {
  localStorage.removeItem("formState");
  localStorage.removeItem("signature");
}

/* =====================
   SAVE
===================== */
function save() {

  const klient = document.getElementById("klient").value;
  const leistung = document.getElementById("leistung").value;

  if (!klient || !leistung) {
    alert("Bitte Klient und Leistung auswählen!");
    return;
  }

  const data = {
    type: "form_input",
    klient: klient,
    leistung: leistung,
    einheit: document.getElementById("einheit").value || 1,
    datum: document.getElementById("datum").value,
    notiz: document.getElementById("notiz").value,
    signature: hasSigned ? canvas.toDataURL("image/png") : ""
  };

  fetch(API_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  })
  .then(() => {
    clearState();
    document.getElementById("pageForm").style.display = "none";
    document.getElementById("pageConfirm").style.display = "block";
  });
}

/* =====================
   HOME
===================== */
function goHome() {
  location.reload();
}

</script>

</body>
</html>
