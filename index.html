<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body {
  font-family: Arial, sans-serif;
  padding: 20px;
  margin: 0;
}

h2 {
  cursor: pointer;
  margin: 0 0 10px 0;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.form-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

select, input, textarea, button {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  box-sizing: border-box;
  border-radius: 8px;
}

select, input, textarea {
  border: 1px solid #999;
}

button {
  border: 1px solid #999;
  background: #f5f5f5;
  min-height: 42px;
}

#einheit {
  text-align: center;
}

textarea {
  min-height: 84px;
  resize: vertical;
}

canvas {
  border: 1px solid #000;
  border-radius: 12px;
  width: 100%;
  height: 200px;
  touch-action: none;
  background: #fff;
  display: block;
}

.btn-row {
  display: flex;
  gap: 10px;
}

.btn-row button {
  flex: 1;
  margin: 0;
}

#pageConfirm {
  display: none;
  text-align: center;
  margin-top: 40px;
}

/* Querformat kompakter */
@media (orientation: landscape) {
  body {
    padding: 10px;
  }

  h2 {
    font-size: 18px;
    margin-bottom: 6px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  textarea,
  canvas,
  .btn-row {
    grid-column: span 2;
  }

  textarea {
    min-height: 64px;
  }

  canvas {
    height: 180px;
  }
}
</style>
</head>

<body>

<div id="pageForm">
  <h2 onclick="reloadDropdowns()" title="Dropdowns neu laden">Leistung erfassen</h2>

  <div class="form-grid">
    <select id="klient"></select>
    <select id="leistung"></select>

    <input id="einheit" value="1" placeholder="Einheit">
    <input id="datum" type="date">

    <textarea id="notiz" placeholder="Notiz"></textarea>

    <canvas id="canvas"></canvas>

    <div class="btn-row">
      <button type="button" onclick="clearCanvas()">Unterschrift löschen</button>
      <button type="button" onclick="save()">Speichern</button>
    </div>
  </div>
</div>

<div id="pageConfirm">
  <h2>Gespeichert</h2>
  <button type="button" onclick="goHome()">Zurück zur Startseite</button>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycby5SUfqIxFdpsvu44jOJM98c9KgW3025-7MMNaSi9zPuzatqeOZEKXIUpm6dU8nOzGmow/exec";

let canvas, ctx;
let drawing = false;
let hasSigned = false;

/* =====================
   INIT
===================== */
window.onload = function () {
  canvas = document.getElementById("canvas");
  ctx = canvas.getContext("2d");

  document.getElementById("datum").valueAsDate = new Date();

  resizeCanvas();
  bindCanvasEvents();
  bindFieldEvents();

  loadDropdowns(true);
};

window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 150));

function bindCanvasEvents() {
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", draw);
  canvas.addEventListener("mouseup", end);
  canvas.addEventListener("mouseleave", end);

  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", draw, { passive: false });
  canvas.addEventListener("touchend", end);
}

function bindFieldEvents() {
  ["klient", "leistung", "einheit", "datum", "notiz"].forEach(id => {
    document.getElementById(id).addEventListener("change", saveState);
    document.getElementById(id).addEventListener("input", saveState);
  });
}

/* =====================
   DROPDOWNS
===================== */
function loadDropdowns(isInitialLoad = false) {
  const oldKlient = document.getElementById("klient").value;
  const oldLeistung = document.getElementById("leistung").value;

  fetch(API_URL + "?t=" + new Date().getTime())
    .then(r => {
      if (!r.ok) {
        throw new Error("HTTP Fehler: " + r.status);
      }
      return r.json();
    })
    .then(data => {
      const klient = document.getElementById("klient");
      const leistung = document.getElementById("leistung");

      klient.innerHTML = "<option value=''>Klient wählen</option>";
      (data.klienten || []).forEach(k => {
        const opt = document.createElement("option");
        opt.value = k;
        opt.textContent = k;
        klient.appendChild(opt);
      });

      leistung.innerHTML = "<option value=''>Leistung wählen</option>";
      (data.leistungen || []).forEach(l => {
        const opt = document.createElement("option");
        opt.value = l;
        opt.textContent = l;
        leistung.appendChild(opt);
      });

      if (oldKlient && Array.from(klient.options).some(o => o.value === oldKlient)) {
        klient.value = oldKlient;
      }

      if (oldLeistung && Array.from(leistung.options).some(o => o.value === oldLeistung)) {
        leistung.value = oldLeistung;
      } else if (Array.from(leistung.options).some(o => o.value.toLowerCase() === "reittherapie")) {
        leistung.value = Array.from(leistung.options).find(o => o.value.toLowerCase() === "reittherapie").value;
      }

      if (isInitialLoad) {
        setTimeout(loadState, 150);
      }

      saveState();
    })
    .catch(err => {
      console.error("Dropdown Fehler:", err);
      alert("Fehler beim Laden: " + err.message);
    });
}

function reloadDropdowns() {
  loadDropdowns(false);
}

/* =====================
   CANVAS
===================== */
function resizeCanvas() {
  if (!canvas || !ctx) return;

  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();

  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;

  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#000";

  const savedSignature = localStorage.getItem("signature");
  if (savedSignature) {
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.drawImage(img, 0, 0, rect.width, rect.height);
    };
    img.src = savedSignature;
    hasSigned = true;
  }
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;

  return {
    x: clientX - rect.left,
    y: clientY - rect.top
  };
}

function start(e) {
  e.preventDefault();
  drawing = true;
  const pos = getPos(e);
  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y);
}

function draw(e) {
  if (!drawing) return;
  e.preventDefault();

  const pos = getPos(e);
  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();

  hasSigned = true;
  saveState();
}

function end() {
  drawing = false;
}

function clearCanvas() {
  const rect = canvas.getBoundingClientRect();
  ctx.clearRect(0, 0, rect.width, rect.height);
  hasSigned = false;
  localStorage.removeItem("signature");
}

/* =====================
   STATE
===================== */
function saveState() {
  const state = {
    klient: document.getElementById("klient").value,
    leistung: document.getElementById("leistung").value,
    einheit: document.getElementById("einheit").value,
    datum: document.getElementById("datum").value,
    notiz: document.getElementById("notiz").value
  };

  localStorage.setItem("formState", JSON.stringify(state));

  if (hasSigned) {
    localStorage.setItem("signature", canvas.toDataURL("image/png"));
  }
}

function loadState() {
  const state = JSON.parse(localStorage.getItem("formState") || "{}");

  if (state.klient) document.getElementById("klient").value = state.klient;
  if (state.leistung) document.getElementById("leistung").value = state.leistung;
  if (state.einheit) document.getElementById("einheit").value = state.einheit;
  if (state.datum) document.getElementById("datum").value = state.datum;
  if (state.notiz) document.getElementById("notiz").value = state.notiz;
}

function clearState() {
  localStorage.removeItem("formState");
  localStorage.removeItem("signature");
}

/* =====================
   SAVE
===================== */
function save() {
  const klient = document.getElementById("klient").value;
  const leistung = document.getElementById("leistung").value;

  if (!klient || !leistung) {
    alert("Bitte Klient und Leistung auswählen!");
    return;
  }

  const data = {
    type: "form_input",
    klient: klient,
    leistung: leistung,
    einheit: document.getElementById("einheit").value || 1,
    datum: document.getElementById("datum").value,
    notiz: document.getElementById("notiz").value,
    signature: hasSigned ? canvas.toDataURL("image/png") : ""
  };

  fetch(API_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  })
  .then(() => {
    clearState();
    document.getElementById("pageForm").style.display = "none";
    document.getElementById("pageConfirm").style.display = "block";
  })
  .catch(err => {
    alert("Fehler: " + err);
  });
}

/* =====================
   HOME
===================== */
function goHome() {
  location.reload();
}
</script>

</body>
</html>
