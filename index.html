<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family: Arial, sans-serif;
  margin:0;
  padding:20px;
  background:#ffffff;
}

/* FORM */
select,input,textarea,button{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border-radius:12px;
  border:1px solid #ddd;
  font-size:16px;
}

#einheit{text-align:center;}

canvas{
  width:100%;
  height:200px;
  border:2px solid #ccc;
  border-radius:18px;
}

/* BUTTONS */
.btn-row{
  display:flex;
  gap:10px;
}

.btn{
  flex:1;
  font-weight:bold;
  border:none;
}

.btn-save{
  background:#c7f9cc;
}

.btn-clear{
  background:#e7f0ff;
}

/* ===== OVERLAY ===== */
#overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(255,255,255,0.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.overlay-box{
  text-align:center;
}

/* Pferd Animation */
.horse{
  font-size:60px;
  animation:run 1s infinite alternate ease-in-out;
}

@keyframes run{
  from{transform:translateX(-10px);}
  to{transform:translateX(10px);}
}

/* Progress Bar */
.progress{
  width:220px;
  height:10px;
  background:#eee;
  border-radius:10px;
  margin:20px auto;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#a0e7e5;
  transition:width .4s ease;
}

.status{
  font-size:16px;
  color:#555;
  font-weight:500;
}

/* CONFIRM */
#confirm{
  display:none;
  text-align:center;
  margin-top:40px;
}

button{
  cursor:pointer;
}
</style>
</head>

<body>

<div id="form">
  <h2 onclick="gohome()">Leistung erfassen</h2>

  <select id="klient"></select>
  <select id="leistung"></select>

  <input id="einheit" value="1">
  <input id="datum" type="date">

  <textarea id="notiz" placeholder="Notiz"></textarea>

  <canvas id="canvas"></canvas>

  <div class="btn-row">
    <button class="btn btn-clear" onclick="clearCanvas()">Löschen</button>
    <button class="btn btn-save" onclick="save()">Speichern</button>
  </div>
</div>

<div id="confirm">
  <h2>Gespeichert</h2>
  <button onclick="location.reload()">Zurück</button>
</div>

<!-- OVERLAY -->
<div id="overlay">
  <div class="overlay-box">
    <div class="horse">🐎</div>

    <div class="progress">
      <div id="bar" class="progress-bar"></div>
    </div>

    <div id="status" class="status">Start...</div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwTDDFrZZ2d5nXFfPdQwtE-YOs88E1lwRjeHpM87R4kNf_fZriuH8-iBPEPPrtnQNO6Qw/exec";

let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");
let drawing = false;

/* =====================
   CANVAS
===================== */
function resizeCanvas(){
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

canvas.addEventListener("mousedown", e=>{
  drawing=true;
  ctx.beginPath();
  ctx.moveTo(e.offsetX,e.offsetY);
});

canvas.addEventListener("mousemove", e=>{
  if(!drawing)return;
  ctx.lineTo(e.offsetX,e.offsetY);
  ctx.stroke();
});

canvas.addEventListener("mouseup", ()=>drawing=false);

function clearCanvas(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

/* =====================
   DROPDOWN
===================== */
function reload(){
  fetch(API_URL)
  .then(r=>r.json())
  .then(data=>{
    let k=document.getElementById("klient");
    let l=document.getElementById("leistung");

    k.innerHTML="<option>Klient wählen</option>";
    data.klienten.forEach(v=>{
      let o=document.createElement("option");
      o.text=v;
      k.add(o);
    });

    l.innerHTML="";
    data.leistungen.forEach(v=>{
      let o=document.createElement("option");
      o.text=v;
      l.add(o);
    });

    l.value="Reittherapie";
  });
}

reload();

/* =====================
   PROGRESS STEUERUNG
===================== */
function setProgress(p,text){
  document.getElementById("bar").style.width=p+"%";
  document.getElementById("status").innerText=text;
}

/* =====================
   SAVE
===================== */
function save(){

  let klient=document.getElementById("klient").value;
  let leistung=document.getElementById("leistung").value;

  if(!klient||!leistung){
    alert("Bitte auswählen");
    return;
  }

  document.getElementById("overlay").style.display="flex";

  setProgress(10,"Daten werden vorbereitet...");

  setTimeout(()=>{

    setProgress(30,"Signatur wird verarbeitet...");

    let signature = canvas.toDataURL();

    setTimeout(()=>{

      setProgress(60,"Übertragung läuft...");

      fetch(API_URL,{
        method:"POST",
        mode:"no-cors",
        body:JSON.stringify({
          klient,
          leistung,
          einheit:document.getElementById("einheit").value,
          datum:document.getElementById("datum").value,
          notiz:document.getElementById("notiz").value,
          signature
        })
      })
      .then(()=>{

        setProgress(90,"Speichern abgeschlossen...");

        setTimeout(()=>{
          setProgress(100,"Fertig");

          document.getElementById("overlay").style.display="none";

          document.getElementById("form").style.display="none";
          document.getElementById("confirm").style.display="block";

        },400);

      })
      .catch(err=>{
        document.getElementById("overlay").style.display="none";
        alert("Fehler");
      });

    },300);

  },200);
}
</script>

</body>
</html>
