<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body { font-family: Arial; padding: 20px; }

select, input, textarea {
  width: 100%;
  margin-bottom: 10px;
  padding: 10px;
  font-size: 16px;
  box-sizing: border-box;
}

canvas {
  border: 1px solid #000;
  width: 100%;
  height: 200px;
  touch-action: none;
  display: block;
  background: #fff;
}

button {
  padding: 14px;
  font-size: 16px;
  margin-top: 10px;
  width: 100%;
  box-sizing: border-box;
}

#pageConfirm {
  display: none;
  text-align: center;
  margin-top: 40px;
}

@media (orientation: landscape) {
  canvas {
    height: 260px;
  }
}
</style>
</head>

<body>

<div id="pageForm">
  <h2>Leistung erfassen</h2>

  <select id="klient"></select>
  <select id="leistung"></select>

  <button type="button" onclick="reloadDropdowns()">Daten aktualisieren</button>

  <input id="einheit" value="1" placeholder="Einheit (z.B. 1)">
  <input id="datum" type="date">
  <textarea id="notiz" placeholder="Notiz"></textarea>

  <h3>Unterschrift</h3>
  <canvas id="canvas"></canvas>
  <button type="button" onclick="clearCanvas()">Unterschrift löschen</button>

  <br><br>
  <button type="button" onclick="save()">Speichern</button>
</div>

<div id="pageConfirm">
  <h2>Gespeichert</h2>
  <p>Der Eintrag wurde erfolgreich übermittelt.</p>
  <button type="button" onclick="goHome()">Zurück zur Startseite</button>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwTDDFrZZ2d5nXFfPdQwtE-YOs88E1lwRjeHpM87R4kNf_fZriuH8-iBPEPPrtnQNO6Qw/exec";

let canvas, ctx;
let drawing = false;
let hasSigned = false;

// =====================
// INIT
// =====================
window.onload = function () {
  loadDropdowns();

  document.getElementById("datum").valueAsDate = new Date();

  canvas = document.getElementById("canvas");
  ctx = canvas.getContext("2d");

  resizeCanvas();

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", draw);
  canvas.addEventListener("mouseup", end);
  canvas.addEventListener("mouseleave", end);

  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", draw, { passive: false });
  canvas.addEventListener("touchend", end);
};

window.addEventListener("resize", function () {
  if (canvas && ctx) {
    resizeCanvas();
  }
});

window.addEventListener("orientationchange", function () {
  if (canvas && ctx) {
    setTimeout(function () {
      resizeCanvas();
    }, 150);
  }
});

// =====================
// DROPDOWNS
// =====================
function loadDropdowns() {
  fetch(API_URL + "?t=" + new Date().getTime())
    .then(r => {
      if (!r.ok) {
        throw new Error("HTTP Fehler: " + r.status);
      }
      return r.json();
    })
    .then(data => {
      const klient = document.getElementById("klient");
      const leistung = document.getElementById("leistung");

      klient.innerHTML = "<option value=''>Klient wählen</option>";
      (data.klienten || []).forEach(k => {
        const opt = document.createElement("option");
        opt.value = k;
        opt.textContent = k;
        klient.appendChild(opt);
      });

      leistung.innerHTML = "<option value=''>Leistung wählen</option>";
      (data.leistungen || []).forEach(l => {
        const opt = document.createElement("option");
        opt.value = l;
        opt.textContent = l;
        leistung.appendChild(opt);
      });
    })
    .catch(err => {
      console.error("Dropdown Fehler:", err);
      alert("Fehler beim Laden: " + err);
    });
}

function reloadDropdowns() {
  loadDropdowns();
}

// =====================
// CANVAS
// =====================
function resizeCanvas() {
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();

  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(ratio, ratio);

  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#000";
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();

  if (e.touches && e.touches.length > 0) {
    return {
      x: e.touches[0].clientX - rect.left,
      y: e.touches[0].clientY - rect.top
    };
  }

  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  };
}

function start(e) {
  e.preventDefault();
  drawing = true;
  const pos = getPos(e);
  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y);
}

function draw(e) {
  if (!drawing) return;
  e.preventDefault();

  const pos = getPos(e);
  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();

  hasSigned = true;
}

function end() {
  drawing = false;
}

function clearCanvas() {
  const rect = canvas.getBoundingClientRect();
  ctx.clearRect(0, 0, rect.width, rect.height);
  hasSigned = false;
}

// =====================
// SAVE
// =====================
function save() {
  const klient = document.getElementById("klient").value;
  const leistung = document.getElementById("leistung").value;

  if (!klient || !leistung) {
    alert("Bitte Klient und Leistung auswählen!");
    return;
  }

  const data = {
    type: "form_input",
    klient: klient,
    leistung: leistung,
    einheit: document.getElementById("einheit").value || 1,
    datum: document.getElementById("datum").value,
    notiz: document.getElementById("notiz").value,
    signature: hasSigned ? canvas.toDataURL("image/png") : ""
  };

  fetch(API_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  })
  .then(() => {
    document.getElementById("pageForm").style.display = "none";
    document.getElementById("pageConfirm").style.display = "block";
  })
  .catch(err => {
    alert("Fehler: " + err);
  });
}

// =====================
// STARTSEITE
// =====================
function goHome() {
  location.reload();
}
</script>

</body>
</html>
