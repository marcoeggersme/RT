<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body{
  font-family: Arial, sans-serif;
  margin:0;
  padding:20px;
  background:#ffffff;
  color:#2f2f2f;
}

h2{cursor:pointer;}

.form{
  display:flex;
  flex-direction:column;
  gap:12px;
}

select,input,textarea{
  width:100%;
  height:52px;
  padding:0 14px;
  border-radius:12px;
  border:1px solid #cfead6;
  font-size:16px;
  background:#eaf7ec;
  color:#2f2f2f;
}

textarea{height:80px;padding-top:12px;}

#einheit{text-align:center;font-weight:600;}

input[type="date"]{
  appearance:none;
  -webkit-appearance:none;
  text-align:center;
}

/* BUTTONS */
.btn-row{display:flex;gap:10px;}

button{
  flex:1;
  height:52px;
  border-radius:12px;
  border:none;
  font-size:16px;
  font-weight:bold;
}

.btn-clear{background:#fde2e2;}
.btn-save{background:#b7e4c7;}

/* CANVAS */
canvas{
  width:100%;
  height:200px;
  border:2px solid #cfead6;
  border-radius:18px;
  background:#f6fbf7;
  touch-action:none;
}

/* OVERLAY */
#overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(255,255,255,0.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.horse{
  font-size:60px;
  animation:run 1s infinite alternate ease-in-out;
}

@keyframes run{
  from{transform:translateX(-10px);}
  to{transform:translateX(10px);}
}

.progress{
  width:220px;
  height:10px;
  background:#eee;
  border-radius:10px;
  margin:20px auto;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#95d5b2;
  transition:width .4s;
}

.status{text-align:center;}

#confirm{
  display:none;
  text-align:center;
  margin-top:40px;
}
</style>
</head>

<body>

<div id="form">
  <h2 onclick="goHome()">Leistung erfassen</h2>

  <div class="form">
    <select id="klient"></select>
    <select id="leistung"></select>

    <input id="einheit" value="1">
    <input id="datum" type="date">

    <textarea id="notiz" placeholder="Notiz"></textarea>

    <canvas id="canvas"></canvas>

    <div class="btn-row">
      <button class="btn-clear" onclick="clearCanvas()">Löschen</button>
      <button class="btn-save" onclick="save()">Speichern</button>
    </div>
  </div>
</div>

<div id="confirm">
  <h2>Gespeichert</h2>

  <p>Direkt bezahlen:</p>
  <img id="paypalQR" style="width:200px;margin:15px 0;">

  <button class="btn-save" onclick="goHome()">Startseite</button>
</div>

<div id="overlay">
  <div>
    <div class="horse">🐎</div>
    <div class="progress"><div id="bar" class="progress-bar"></div></div>
    <div id="status" class="status">Start...</div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwTDDFrZZ2d5nXFfPdQwtE-YOs88E1lwRjeHpM87R4kNf_fZriuH8-iBPEPPrtnQNO6Qw/exec";
const PAYPAL_EMAIL = "daniela.schroeder.2003@gmail.com";

/* INIT */
window.onload = function(){
  const d = new Date();
  document.getElementById("datum").value = d.toISOString().split("T")[0];
  resizeCanvas();
  loadDropdowns();
};

/* CANVAS */
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");
let drawing = false;

function resizeCanvas(){
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
}
window.addEventListener("resize", resizeCanvas);

canvas.addEventListener("mousedown", e=>{
  drawing=true;
  ctx.beginPath();
  ctx.moveTo(e.offsetX,e.offsetY);
});

canvas.addEventListener("mousemove", e=>{
  if(!drawing)return;
  ctx.lineTo(e.offsetX,e.offsetY);
  ctx.stroke();
});

canvas.addEventListener("mouseup", ()=>drawing=false);

canvas.addEventListener("touchstart", e=>{
  drawing=true;
  const t=e.touches[0];
  const rect=canvas.getBoundingClientRect();
  ctx.beginPath();
  ctx.moveTo(t.clientX-rect.left,t.clientY-rect.top);
},{passive:false});

canvas.addEventListener("touchmove", e=>{
  if(!drawing)return;
  e.preventDefault();
  const t=e.touches[0];
  const rect=canvas.getBoundingClientRect();
  ctx.lineTo(t.clientX-rect.left,t.clientY-rect.top);
  ctx.stroke();
},{passive:false});

canvas.addEventListener("touchend", ()=>drawing=false);

function clearCanvas(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

/* DROPDOWN */
function loadDropdowns(){
  fetch(API_URL+"?t="+Date.now())
  .then(r=>r.json())
  .then(data=>{
    let k=document.getElementById("klient");
    let l=document.getElementById("leistung");

    k.innerHTML="<option value=''>Klient wählen</option>";
    data.klienten.forEach(v=>{
      let o=document.createElement("option");
      o.value=v;
      o.text=v;
      k.add(o);
    });

    l.innerHTML="";
    data.leistungen.forEach(v=>{
      let o=document.createElement("option");
      o.value=v;
      o.text=v;
      l.add(o);
    });

    l.value="Reittherapie";
  });
}

/* QR GENERATOR */
function buildPayPalQR(amount, note){
  const link = `https://www.paypal.me/${PAYPAL_EMAIL}/${amount}?note=${encodeURIComponent(note)}`;
  return `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(link)}`;
}

/* PROGRESS */
function setProgress(p,t){
  document.getElementById("bar").style.width=p+"%";
  document.getElementById("status").innerText=t;
}

/* SAVE */
function save(){

  let klient=document.getElementById("klient").value;
  let leistung=document.getElementById("leistung").value;

  if(!klient||!leistung){
    alert("Bitte auswählen");
    return;
  }

  document.getElementById("overlay").style.display="flex";
  setProgress(10,"Daten werden vorbereitet...");

  setTimeout(()=>{
    setProgress(40,"Signatur wird verarbeitet...");
    let signature=canvas.toDataURL();

    setTimeout(()=>{
      setProgress(70,"Übertragung läuft...");

      fetch(API_URL,{
        method:"POST",
        mode:"no-cors",
        body:JSON.stringify({
          klient,
          leistung,
          einheit:document.getElementById("einheit").value,
          datum:document.getElementById("datum").value,
          notiz:document.getElementById("notiz").value,
          signature
        })
      })
      .then(()=>{

        /* QR setzen */
        const amount = document.getElementById("einheit").value || 1;
        const note = "Reittherapie " + document.getElementById("datum").value;

        document.getElementById("paypalQR").src = buildPayPalQR(amount, note);

        setProgress(100,"Fertig");

        setTimeout(()=>{
          document.getElementById("overlay").style.display="none";
          document.getElementById("form").style.display="none";
          document.getElementById("confirm").style.display="block";
        },400);
      });

    },300);
  },200);
}

/* HOME */
function goHome(){
  location.href="index.html";
}
</script>

</body>
</html>
