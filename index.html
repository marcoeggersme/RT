<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial; padding: 20px; }

select, input, textarea {
  width: 100%;
  margin-bottom: 10px;
  padding: 10px;
  font-size: 16px;
}

canvas {
  border: 1px solid #000;
  width: 100%;
  height: 200px;
  touch-action: none;
}

button {
  padding: 14px;
  font-size: 16px;
  margin-top: 10px;
  width: 100%;
}
</style>
</head>

<body>

<h2>Leistung erfassen</h2>

<select id="klient"></select>
<select id="leistung"></select>

<input id="einheit" placeholder="Einheit (z.B. 1)">
<input id="datum" type="date">
<textarea id="notiz" placeholder="Notiz"></textarea>

<h3>Unterschrift</h3>
<canvas id="canvas"></canvas>
<button onclick="clearCanvas()">Unterschrift löschen</button>

<br><br>
<button onclick="save()">Speichern</button>

<script>

// 🔴 DEINE WEBAPP URL
const API_URL = "https://script.google.com/macros/s/AKfycbwadGDEDbntAAfug8cby_Un51vg8OVhInwZ1Tjx0rWZf2StOl_E_h61_pi3nT7QIvrKaw/exec";


// =====================
// DROPDOWNS LADEN
// =====================
function loadDropdowns() {
  fetch(API_URL)
    .then(r => r.json())
    .then(data => {

      const klient = document.getElementById("klient");
      const leistung = document.getElementById("leistung");

      klient.innerHTML = "<option value=''>Klient wählen</option>";
      data.klienten.forEach(k => {
        klient.innerHTML += `<option value="${k}">${k}</option>`;
      });

      leistung.innerHTML = "<option value=''>Leistung wählen</option>";
      data.leistungen.forEach(l => {
        leistung.innerHTML += `<option value="${l}">${l}</option>`;
      });

    })
    .catch(err => alert("Fehler beim Laden der Dropdowns: " + err));
}

window.onload = function () {
  loadDropdowns();

  // Default Datum = heute
  document.getElementById("datum").valueAsDate = new Date();
};


// =====================
// CANVAS SIGNATUR
// =====================
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let drawing = false;
let hasSigned = false;

function resizeCanvas() {
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.offsetWidth * ratio;
  canvas.height = canvas.offsetHeight * ratio;
  ctx.scale(ratio, ratio);
}
resizeCanvas();

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  if (e.touches) {
    return {
      x: e.touches[0].clientX - rect.left,
      y: e.touches[0].clientY - rect.top
    };
  }
  return { x: e.offsetX, y: e.offsetY };
}

function start(e) {
  drawing = true;
  const pos = getPos(e);
  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y);
}

function draw(e) {
  if (!drawing) return;
  e.preventDefault();

  const pos = getPos(e);

  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();

  hasSigned = true;
}

function end() {
  drawing = false;
}

canvas.addEventListener("mousedown", start);
canvas.addEventListener("mousemove", draw);
canvas.addEventListener("mouseup", end);
canvas.addEventListener("mouseleave", end);

canvas.addEventListener("touchstart", start);
canvas.addEventListener("touchmove", draw);
canvas.addEventListener("touchend", end);

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  hasSigned = false;
}


// =====================
// SPEICHERN
// =====================
function save() {

  const klient = document.getElementById("klient").value;
  const leistung = document.getElementById("leistung").value;

  if (!klient || !leistung) {
    alert("Bitte Klient und Leistung auswählen!");
    return;
  }

  if (!hasSigned) {
    alert("Bitte unterschreiben!");
    return;
  }

  const data = {
    klient: klient,
    leistung: leistung,
    einheit: document.getElementById("einheit").value || 1,
    datum: document.getElementById("datum").value,
    notiz: document.getElementById("notiz").value,
    signature: canvas.toDataURL("image/png")   // 🔥 WICHTIG!
  };

  fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  })
  .then(r => r.json())
  .then(res => {

    if (res.status === "ok") {
      alert("Gespeichert!");
      location.reload();
    } else {
      alert("Fehler: " + res.message);
    }

  })
  .catch(err => alert("Fehler: " + err));
}

</script>

</body>
</html>
