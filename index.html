<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unterschrift</title>

<style>
body {
    margin: 0;
    padding: 10px;
    text-align: center;
    font-family: Arial, sans-serif;
}

canvas {
    border: 2px solid #333;
    border-radius: 10px;
    touch-action: none;
}

button {
    margin: 10px;
    padding: 12px 20px;
    font-size: 16px;
}

#result {
    margin-top: 12px;
    font-size: 16px;
}
</style>
</head>

<body>

<canvas id="canvas" width="350" height="200"></canvas><br>

<button type="button" onclick="clearCanvas()">Löschen</button>
<button type="button" onclick="saveSignature()">Speichern</button>

<p id="result"></p>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const resultEl = document.getElementById("result");

let drawing = false;

// ==========================================
// MAUS / TOUCH POSITION
// ==========================================
function getPos(e) {
    const rect = canvas.getBoundingClientRect();

    if (e.touches && e.touches.length > 0) {
        return {
            x: e.touches[0].clientX - rect.left,
            y: e.touches[0].clientY - rect.top
        };
    }

    return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
    };
}

// ==========================================
// ZEICHNEN
// ==========================================
function start(e) {
    e.preventDefault();
    drawing = true;

    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
}

function stop(e) {
    e.preventDefault();
    drawing = false;
    ctx.beginPath();
}

function draw(e) {
    if (!drawing) return;

    e.preventDefault();

    const pos = getPos(e);

    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.strokeStyle = "black";

    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
}

// ==========================================
// EVENTS
// ==========================================
canvas.addEventListener("mousedown", start);
canvas.addEventListener("mouseup", stop);
canvas.addEventListener("mouseleave", stop);
canvas.addEventListener("mousemove", draw);

canvas.addEventListener("touchstart", start, { passive: false });
canvas.addEventListener("touchend", stop, { passive: false });
canvas.addEventListener("touchcancel", stop, { passive: false });
canvas.addEventListener("touchmove", draw, { passive: false });

// ==========================================
// LEEREN
// ==========================================
function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    resultEl.innerHTML = "";
}

// ==========================================
// PRÜFEN OB LEER
// ==========================================
function canvasIsEmpty() {
    const blank = document.createElement("canvas");
    blank.width = canvas.width;
    blank.height = canvas.height;
    return canvas.toDataURL() === blank.toDataURL();
}

// ==========================================
// SPEICHERN
// ==========================================
function saveSignature() {

    if (canvasIsEmpty()) {
        resultEl.innerHTML = "<b>Bitte unterschreiben!</b>";
        return;
    }

    const dataURL = canvas.toDataURL("image/png");
    const fileName = "sign_" + new Date().getTime() + ".png";

    const params = new URLSearchParams(window.location.search);
    const row = params.get("row");
    console.log("ROW:", row);
    if (!row || row === "0") {
        resultEl.innerHTML = "<b>Fehler:</b><br>Keine gültige Zeilennummer übergeben.";
        return;
    } 

    resultEl.innerHTML = "Speichern läuft...";

    fetch("https://script.google.com/macros/s/AKfycbwhbFIPcO3_gas71ZDoPLKdQEhagiqVK38BVR8Q-neF3uCSkbFHIgDiICIscfxFdA3JFg/exec", {
        method: "POST",
        body: JSON.stringify({
            image: dataURL,
            fileName: fileName,
            row: row
        }),
        headers: {
            "Content-Type": "text/plain"
        }
    })
    .then(res => res.json())
    .then(data => {

        if (data.status === "ok") {
            resultEl.innerHTML =
                "<b>✔ Unterschrift gespeichert</b><br><br>" +
                "<a href='" + data.url + "' target='_blank'>👉 Unterschrift anzeigen</a><br><br>" +
                "<small>" + data.url + "</small>";
        } else {
            resultEl.innerHTML = "<b>Fehler:</b><br>" + data.message;
        }

    })
    .catch(err => {
        resultEl.innerHTML = "<b>Upload fehlgeschlagen:</b><br>" + err;
    });
}
</script>

</body>
</html>
