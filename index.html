<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unterschrift</title>

<style>
body {
    margin: 0;
    padding: 10px;
    text-align: center;
    font-family: Arial, sans-serif;
}

canvas {
    border: 2px solid #333;
    border-radius: 10px;
    touch-action: none;
}

button {
    margin: 10px;
    padding: 12px 20px;
    font-size: 16px;
}
</style>
</head>

<body>

<canvas id="canvas" width="350" height="200"></canvas><br>

<button onclick="clearCanvas()">Löschen</button>
<button onclick="saveSignature()">Speichern</button>

<p id="result"></p>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let drawing = false;

function getPos(e) {
    const rect = canvas.getBoundingClientRect();

    if (e.touches) {
        return {
            x: e.touches[0].clientX - rect.left,
            y: e.touches[0].clientY - rect.top
        };
    } else {
        return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
        };
    }
}

function start(e) {
    e.preventDefault();
    drawing = true;

    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
}

function stop(e) {
    drawing = false;
    ctx.beginPath();
}

function draw(e) {
    if (!drawing) return;

    e.preventDefault();

    const pos = getPos(e);

    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.strokeStyle = "black";

    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
}

canvas.addEventListener("mousedown", start);
canvas.addEventListener("mouseup", stop);
canvas.addEventListener("mouseleave", stop);
canvas.addEventListener("mousemove", draw);

canvas.addEventListener("touchstart", start, { passive: false });
canvas.addEventListener("touchend", stop, { passive: false });
canvas.addEventListener("touchcancel", stop, { passive: false });
canvas.addEventListener("touchmove", draw, { passive: false });

function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function saveSignature() {
    const dataURL = canvas.toDataURL("image/png");
    const fileName = "sign_" + new Date().getTime() + ".png";

    // Parameter aus URL holen (optional)
    const params = new URLSearchParams(window.location.search);
    const row = params.get("row");

    fetch("https://script.google.com/macros/s/AKfycbyqwmHYcoO1128-ENxNsxX4WsGrIaQxJ5kCJkSBIR8Q2q9QTa_QTPPF2KiTV0nmUdXNBQ/exec", {
        method: "POST",
       headers: {
            "Content-Type": "text/plain"
        }
        body: JSON.stringify({
            image: dataURL,
            fileName: fileName,
            row: row
        }),
        mode: "cors"
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === "ok") {

            document.getElementById("result").innerHTML =
                "✔ gespeichert<br><br>" +
                '<a href="' + data.url + '" target="_blank">Unterschrift anzeigen</a>';

        } else {
            document.getElementById("result").innerHTML =
                "Fehler: " + data.message;
        }
    })
    .catch(err => {
        document.getElementById("result").innerHTML =
            "Upload fehlgeschlagen: " + err;
    });
}
</script>

</body>
</html>
