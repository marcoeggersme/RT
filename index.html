<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: Arial; padding: 20px; }
input, textarea { width: 100%; margin-bottom: 10px; padding: 8px; }
canvas { border: 1px solid #000; width: 100%; height: 200px; }
button { padding: 10px; font-size: 16px; margin-top: 10px; }
</style>
</head>

<body>

<h2>Leistung erfassen</h2>

<input id="klient" placeholder="Klient">
<input id="leistung" placeholder="Leistung">
<input id="einheit" placeholder="Einheit">
<input id="datum" type="date">
<input id="ort" placeholder="Ort">
<textarea id="notiz" placeholder="Notiz"></textarea>

<h3>Unterschrift</h3>
<canvas id="canvas"></canvas>
<button onclick="clearCanvas()">Löschen</button>

<br><br>
<button onclick="save()">Speichern</button>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let drawing = false;

canvas.addEventListener("mousedown", () => drawing = true);
canvas.addEventListener("mouseup", () => drawing = false);
canvas.addEventListener("mousemove", draw);

function draw(e) {
  if (!drawing) return;
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  ctx.lineTo(e.offsetX, e.offsetY);
  ctx.stroke();
}

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function save() {

  const data = {
    klient: document.getElementById("klient").value,
    leistung: document.getElementById("leistung").value,
    einheit: document.getElementById("einheit").value,
    datum: document.getElementById("datum").value,
    ort: document.getElementById("ort").value,
    notiz: document.getElementById("notiz").value,
    image: canvas.toDataURL()
  };

  fetch("https://script.google.com/macros/s/AKfycbxKewyLPFHAYHNKBFpUP-rRcyzYIqsDibXra185gJwEV0E6Lb4xr4hvyr4c7ojjoU_HLw/exec", {
    method: "POST",
    body: JSON.stringify(data)
  })
  .then(r => r.json())
  .then(res => {
    if (res.status === "ok") {
      alert("Gespeichert!");
      location.reload();
    } else {
      alert("Fehler: " + res.message);
    }
  });
}

</script>

</body>
</html>
