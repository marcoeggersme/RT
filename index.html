<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  padding: 20px;
  margin: 0;
}

h2 {
  cursor: pointer;
  margin-bottom: 10px;
}

/* 🔥 Einheitliches Feldlayout */
select, input, textarea, button {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  box-sizing: border-box;
  border-radius: 8px;
}

/* Datum explizit */
#datum {
  width: 100%;
}

/* Einheit mittig */
#einheit {
  text-align: center;
}

textarea {
  min-height: 80px;
}

/* Canvas */
canvas {
  border: 1px solid #000;
  border-radius: 12px;
  width: 100%;
  height: 200px;
  background: #fff;
}

/* 🔥 Button Design */
.btn-row {
  display: flex;
  gap: 10px;
}

.btn-row button {
  flex: 1;
  border: none;
  font-weight: bold;
}

/* sekundär */
.btn-secondary {
  background: #e0e0e0;
}

/* primär */
.btn-primary {
  background: #4CAF50;
  color: white;
}

/* Hover */
button:active {
  transform: scale(0.98);
}

/* Layout */
.form-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* Querformat */
@media (orientation: landscape) {
  body { padding: 10px; }

  h2 {
    font-size: 18px;
    margin-bottom: 5px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  textarea,
  canvas,
  .btn-row {
    grid-column: span 2;
  }

  canvas {
    height: 180px;
  }
}

#pageConfirm {
  display: none;
  text-align: center;
  margin-top: 40px;
}
</style>
</head>

<body>

<div id="pageForm">
  <h2 onclick="reloadDropdowns()">Leistung erfassen</h2>

  <div class="form-grid">
    <select id="klient"></select>
    <select id="leistung"></select>

    <input id="einheit" value="1">
    <input id="datum" type="date">

    <textarea id="notiz" placeholder="Notiz"></textarea>

    <canvas id="canvas"></canvas>

    <div class="btn-row">
      <button class="btn-secondary" onclick="clearCanvas()">Löschen</button>
      <button class="btn-primary" onclick="save()">Speichern</button>
    </div>
  </div>
</div>

<div id="pageConfirm">
  <h2>Gespeichert</h2>
  <button onclick="goHome()">Zurück zur Startseite</button>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycby5SUfqIxFdpsvu44jOJM98c9KgW3025-7MMNaSi9zPuzatqeOZEKXIUpm6dU8nOzGmow/exec";

let canvas, ctx;
let drawing = false;
let hasSigned = false;

/* =====================
   INIT
===================== */
window.onload = function () {

  canvas = document.getElementById("canvas");
  ctx = canvas.getContext("2d");

  document.getElementById("datum").valueAsDate = new Date();

  resizeCanvas();
  bindEvents();

  loadDropdowns(true);
};

function bindEvents() {
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", draw);
  canvas.addEventListener("mouseup", end);
  canvas.addEventListener("mouseleave", end);

  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", draw, { passive: false });
  canvas.addEventListener("touchend", end);

  ["klient","leistung","einheit","datum","notiz"].forEach(id => {
    document.getElementById(id).addEventListener("change", saveState);
  });
}

/* =====================
   DROPDOWNS (FIXED!)
===================== */
function loadDropdowns(initial = false) {

  const state = JSON.parse(localStorage.getItem("formState") || "{}");

  fetch(API_URL + "?t=" + new Date().getTime())
    .then(r => r.json())
    .then(data => {

      const klient = document.getElementById("klient");
      const leistung = document.getElementById("leistung");

      klient.innerHTML = "<option value=''>Klient wählen</option>";
      (data.klienten || []).forEach(k => {
        const opt = document.createElement("option");
        opt.value = k;
        opt.textContent = k;
        klient.appendChild(opt);
      });

      leistung.innerHTML = "<option value=''>Leistung wählen</option>";
      (data.leistungen || []).forEach(l => {
        const opt = document.createElement("option");
        opt.value = l;
        opt.textContent = l;
        leistung.appendChild(opt);
      });

      // 🔥 State wiederherstellen
      if (state.klient) klient.value = state.klient;

      if (state.leistung) {
        leistung.value = state.leistung;
      } else {
        const def = Array.from(leistung.options)
          .find(o => o.value.toLowerCase() === "reittherapie");
        if (def) leistung.value = def.value;
      }

      if (initial) loadState();
    });
}

/* 🔥 Jetzt funktioniert der Klick */
function reloadDropdowns() {
  saveState();
  loadDropdowns(false);
}

/* =====================
   CANVAS
===================== */
function resizeCanvas() {
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();

  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;

  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

  const sig = localStorage.getItem("signature");
  if (sig) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
    img.src = sig;
    hasSigned = true;
  }
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: x - rect.left, y: y - rect.top };
}

function start(e) {
  e.preventDefault();
  drawing = true;
  const p = getPos(e);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
}

function draw(e) {
  if (!drawing) return;
  e.preventDefault();

  const p = getPos(e);
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.lineTo(p.x, p.y);
  ctx.stroke();

  hasSigned = true;
  saveState();
}

function end() { drawing = false; }

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  hasSigned = false;
  localStorage.removeItem("signature");
}

/* =====================
   STATE
===================== */
function saveState() {
  const state = {
    klient: document.getElementById("klient").value,
    leistung: document.getElementById("leistung").value,
    einheit: document.getElementById("einheit").value,
    datum: document.getElementById("datum").value,
    notiz: document.getElementById("notiz").value
  };
  localStorage.setItem("formState", JSON.stringify(state));

  if (hasSigned) {
    localStorage.setItem("signature", canvas.toDataURL());
  }
}

function loadState() {
  const state = JSON.parse(localStorage.getItem("formState") || "{}");

  if (state.einheit) document.getElementById("einheit").value = state.einheit;
  if (state.datum) document.getElementById("datum").value = state.datum;
  if (state.notiz) document.getElementById("notiz").value = state.notiz;
}

/* =====================
   SAVE
===================== */
function save() {

  const klient = document.getElementById("klient").value;
  const leistung = document.getElementById("leistung").value;

  if (!klient || !leistung) {
    alert("Bitte auswählen!");
    return;
  }

  const data = {
    type: "form_input",
    klient,
    leistung,
    einheit: document.getElementById("einheit").value,
    datum: document.getElementById("datum").value,
    notiz: document.getElementById("notiz").value,
    signature: hasSigned ? canvas.toDataURL() : ""
  };

  fetch(API_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  })
  .then(() => {
    localStorage.clear();
    document.getElementById("pageForm").style.display = "none";
    document.getElementById("pageConfirm").style.display = "block";
  });
}

/* =====================
   HOME
===================== */
function goHome() {
  location.reload();
}

</script>

</body>
</html>
