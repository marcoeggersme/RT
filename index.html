<!DOCTYPE html>
<html lang="de">
<head>
<!-- ICONS -->
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">

<!-- PWA -->
<link rel="manifest" href="./manifest.json?v=2">

<!-- MOBILE APP -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reittherapie">
<meta name="theme-color" content="#b7e4c7">
<link rel="icon" href="./icon-192.png?v=2">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body{
  font-family: Arial, sans-serif;
  margin:0;
  padding:20px;
  background:#ffffff;
  color:#2f2f2f;

  display:flex;
  justify-content:center;
}

.form-wrapper{
  width:100%;
  max-width:520px;
}

h2{
  cursor:pointer;
  color:#2f2f2f;
}

/* FORM */
.form{
  display:flex;
  flex-direction:column;
  gap:12px;
}

select,input,textarea{
  width:100%;
  min-width:0;
  height:58px;
  font-size:17px;
  padding:0 14px;
  border-radius:12px;
  border:1px solid #cfead6;
  background:#eaf7ec;
  color:#2f2f2f;
  box-sizing:border-box;
}

textarea{
  height:80px;
  padding-top:12px;
  resize:vertical;
}

#einheit{
  text-align:center;
  font-weight:600;
}

input[type="date"]{
  appearance:none;
  -webkit-appearance:none;
  text-align:center;
  font-weight:500;
  width:100%;
  min-width:0;
  max-width:100%;
}

/* BUTTONS */
.btn-row{
  display:flex;
  gap:10px;
}

button{
  flex:1;
  height:52px;
  border-radius:12px;
  border:none;
  font-size:16px;
  font-weight:bold;
  color:#2f2f2f;
  cursor:pointer;
}

.btn-clear{
  background:#fde2e2;
}

.btn-save{
  background:#b7e4c7;
}

html, body {
  overscroll-behavior: contain;
}

/* CANVAS */
canvas{
  width:100%;
  height:200px;
  border:2px solid #cfead6;
  border-radius:18px;
  background:#f6fbf7;
  touch-action:none;
  display:block;
}

/* QUERFORMAT: 2 Spalten */
@media (orientation: landscape){
  .form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    align-items:start;
  }

  textarea,
  canvas,
  .btn-row{
    grid-column:1 / span 2;
  }
}

/* OVERLAY */
#overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(255,255,255,0.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.horse{
  font-size:60px;
  animation:run 1s infinite alternate ease-in-out;
}

@keyframes run{
  from{transform:translateX(-10px);}
  to{transform:translateX(10px);}
}

.progress{
  width:220px;
  height:10px;
  background:#eee;
  border-radius:10px;
  margin:20px auto;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#95d5b2;
  transition:width .4s;
}

.status{
  text-align:center;
  color:#2f2f2f;
}

/* CONFIRM */
#confirm{
  display:none;
  text-align:center;
  margin-top:40px;
  color:#2f2f2f;
}

.confirm-inner{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
}

#paypalQR{
  display:block;
  width:200px;
  max-width:80vw;
  margin:0 auto;
}

.confirm-button-wrap{
  display:flex;
  justify-content:center;
  width:100%;
}

.confirm-button-wrap button{
  flex:none;
  width:220px;
  max-width:80vw;
}
</style>
</head>

<body>

<div id="form" class="form-wrapper">
  <h2 onclick="goHome()">Leistung erfassen</h2>

  <div class="form">
    <select id="klient"></select>
    <select id="leistung"></select>

    <input id="einheit" value="1">
    <input id="datum" type="date">

    <textarea id="notiz" placeholder="Notiz"></textarea>

    <canvas id="canvas"></canvas>

    <div class="btn-row">
      <button type="button" class="btn-clear" onclick="clearCanvas()">Löschen</button>
      <button type="button" class="btn-save" onclick="save()">Speichern</button>
    </div>
  </div>
</div>

<div id="confirm">
  <div class="confirm-inner">
    <h2>Gespeichert</h2>
    <p>Direkt bezahlen:</p>
    <img id="paypalQR" alt="PayPal QR-Code">
    <div class="confirm-button-wrap">
      <button type="button" class="btn-save" onclick="goHome()">Startseite</button>
    </div>
  </div>
</div>

<div id="overlay">
  <div>
    <div class="horse">🐎</div>
    <div class="progress"><div id="bar" class="progress-bar"></div></div>
    <div id="status" class="status">Start...</div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycby6TX3IP0IomYvlbJyq2P22qRwSVAcMGk5HRUErFrDGuLdRGday9gIMRBKLzYRUvQbORw/exec";
const PAYPAL_EMAIL = "daniela.schroeder.2003@gmail.com";
const CACHE_NAME = "reittherapie-v2"; // hochzählen!

/* INIT */
window.onload = function(){
  const d = new Date();
  document.getElementById("datum").value = d.toISOString().split("T")[0];
  resizeCanvas();
  loadDropdowns();
};

/* CANVAS */
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");
let drawing = false;
let hasSignature = false;

function resizeCanvas(){
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();

  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;

  ctx.setTransform(ratio,0,0,ratio,0,0);
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#2f2f2f";
}
window.addEventListener("resize", resizeCanvas);
canvas.addEventListener("touchcancel", end);

function getPos(e){
  const rect = canvas.getBoundingClientRect();

  if(e.touches && e.touches.length){
    return {
      x: e.touches[0].clientX - rect.left,
      y: e.touches[0].clientY - rect.top
    };
  } else {
    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top
    };
  }
}

function start(e){
  e.preventDefault();
  drawing = true;
  const pos = getPos(e);
  ctx.beginPath();
  ctx.moveTo(pos.x,pos.y);
}

function draw(e){
  if(!drawing) return;
  e.preventDefault();

  const pos = getPos(e);
  ctx.lineTo(pos.x,pos.y);
  ctx.stroke();

  hasSignature = true; // <-- WICHTIG
}

function end(){
  drawing = false;
}

canvas.addEventListener("mousedown", start);
canvas.addEventListener("mousemove", draw);
canvas.addEventListener("mouseup", end);
canvas.addEventListener("mouseleave", end);

canvas.addEventListener("touchstart", start, {passive:false});
canvas.addEventListener("touchmove", draw, {passive:false});
canvas.addEventListener("touchend", end);

function clearCanvas(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  hasSignature = false; // <-- Reset
}

/* DROPDOWN – ohne Cache */
function loadDropdowns(){

  const url = API_URL + "?action=getDropdowns&t=" + new Date().getTime();

  fetch(url, {
    method: "GET"
  })
  .then(response => {

    if (!response.ok) {
      throw new Error("HTTP Status " + response.status);
    }

    return response.json();
  })
  .then(data => {

    let k = document.getElementById("klient");
    let l = document.getElementById("leistung");

    k.innerHTML = "<option value=''>Klient wählen</option>";
    l.innerHTML = "";

    if (!data || !data.klienten || !data.leistungen) {
      throw new Error("Ungültige Serverantwort");
    }

    data.klienten.forEach(v => {
      let o = document.createElement("option");
      o.value = v;
      o.text = v;
      k.add(o);
    });

    data.leistungen.forEach(v => {
      let o = document.createElement("option");
      o.value = v;
      o.text = v;
      l.add(o);
    });

    // Standardwert setzen
    if ([...l.options].some(o => o.value === "Reittherapie")) {
      l.value = "Reittherapie";
    }

  })
  .catch(err => {

    console.error("Dropdown Fehler:", err);

    // 👇 KEIN harter Abbruch mehr
    setTimeout(() => {
      loadDropdowns();
    }, 1500);

  });
}

/* QR GENERATOR */
function buildPayPalQR(amount, note){
  const link = `https://www.paypal.me/${PAYPAL_EMAIL}/${amount}?note=${encodeURIComponent(note)}`;
  return `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(link)}`;
}

/* PROGRESS */
function setProgress(p,t){
  document.getElementById("bar").style.width=p+"%";
  document.getElementById("status").innerText=t;
}

/* SAVE */
function save(){

  let klient=document.getElementById("klient").value;
  let leistung=document.getElementById("leistung").value;

  if(!klient||!leistung){
    alert("Bitte auswählen");
    return;
  }

  document.getElementById("overlay").style.display="flex";
  setProgress(10,"Daten werden vorbereitet...");

  setTimeout(()=>{
    setProgress(40,"Signatur wird verarbeitet...");
    let signature = null;

  if(hasSignature){
    signature = canvas.toDataURL("image/png");
  }

    setTimeout(()=>{
      setProgress(70,"Übertragung läuft...");

      fetch(API_URL,{
        method:"POST",
        mode:"no-cors",
        headers: {
          "Content-Type": "application/json"
        },
       body: JSON.stringify({
        type: "form_input",
        klient,
        leistung,
        einheit:document.getElementById("einheit").value,
        datum:document.getElementById("datum").value,
        notiz:document.getElementById("notiz").value,
        signature
      })
      })
      .then(()=>{
        // Erfolg wird angenommen (GAS bestätigt nicht aktiv)
        const amount = document.getElementById("einheit").value || 1;
        const note = "Reittherapie " + document.getElementById("datum").value;

        document.getElementById("paypalQR").src = buildPayPalQR(amount, note);

        setProgress(100,"Fertig");

        setTimeout(()=>{
          document.getElementById("overlay").style.display="none";
          document.getElementById("form").style.display="none";
          document.getElementById("confirm").style.display="block";
        },400);
      })
      .catch(()=>{
        document.getElementById("overlay").style.display="none";
        alert("Fehler beim Speichern");
      });

    },300);
  },200);
}

/* HOME */
function goHome(){
  location.href = "index.html?t=" + Date.now();
}

if ("serviceWorker" in navigator) {

  navigator.serviceWorker.register("./service-worker.js?t=" + Date.now())
    .then(reg => {

      console.log("Service Worker aktiv");

      // Update sofort aktivieren
      reg.update();

    })
    .catch(err => console.error("SW Fehler:", err));
}
</script>
</body>
</html>
