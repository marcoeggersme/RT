<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unterschrift</title>

<style>
body {
    margin: 0;
    padding: 10px;
    text-align: center;
    font-family: Arial, sans-serif;
}

canvas {
    border: 2px solid #333;
    border-radius: 10px;
    touch-action: none;
}

button {
    margin: 10px;
    padding: 12px 20px;
    font-size: 16px;
}

#result {
    margin-top: 12px;
}
</style>
</head>

<body>

<canvas id="canvas" width="350" height="200"></canvas><br>

<button onclick="clearCanvas()">Löschen</button>
<button onclick="saveSignature()">Speichern</button>

<p id="result"></p>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const resultEl = document.getElementById("result");

let drawing = false;

// =======================
// Position ermitteln
// =======================
function getPos(e) {
    const rect = canvas.getBoundingClientRect();

    if (e.touches) {
        return {
            x: e.touches[0].clientX - rect.left,
            y: e.touches[0].clientY - rect.top
        };
    }

    return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
    };
}

// =======================
// Zeichnen
// =======================
function start(e) {
    e.preventDefault();
    drawing = true;

    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
}

function stop(e) {
    drawing = false;
    ctx.beginPath();
}

function draw(e) {
    if (!drawing) return;

    e.preventDefault();

    const pos = getPos(e);

    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.strokeStyle = "black";

    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
}

// =======================
// Events
// =======================
canvas.addEventListener("mousedown", start);
canvas.addEventListener("mouseup", stop);
canvas.addEventListener("mouseleave", stop);
canvas.addEventListener("mousemove", draw);

canvas.addEventListener("touchstart", start, { passive: false });
canvas.addEventListener("touchend", stop);
canvas.addEventListener("touchmove", draw, { passive: false });

// =======================
// Canvas löschen
// =======================
function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    resultEl.innerHTML = "";
}

// =======================
// Prüfen ob leer
// =======================
function isCanvasEmpty() {
    const blank = document.createElement("canvas");
    blank.width = canvas.width;
    blank.height = canvas.height;
    return canvas.toDataURL() === blank.toDataURL();
}

// =======================
// Speichern
// =======================
function saveSignature() {

    if (isCanvasEmpty()) {
        resultEl.innerHTML = "<b>Bitte zuerst unterschreiben!</b>";
        return;
    }

    const params = new URLSearchParams(window.location.search);
    let row = params.get("row");

    // 🔥 WICHTIG: row prüfen
    if (!row || isNaN(row) || Number(row) < 2) {
        resultEl.innerHTML = "<b>Fehler:</b> Ungültige Zeilennummer.";
        return;
    }

    row = Number(row);

    const dataURL = canvas.toDataURL("image/png");

    resultEl.innerHTML = "Speichern läuft...";

    fetch("https://script.google.com/macros/s/AKfycbw0xL7W-GtH4S5-4Fa3z_elxeEaG5DKUe3zQgH3iP4Ud_8z5oLV_ZIIzRMGXG0r_ORNtw/exec", {
        method: "POST",
        headers: {
            "Content-Type": "text/plain"
        },
        body: JSON.stringify({
            image: dataURL,
            row: row
        })
    })
    .then(res => res.json())
    .then(data => {

        if (data.status === "ok") {
            resultEl.innerHTML =
                "<b>✔ gespeichert</b><br><br>" +
                "<a href='" + data.url + "' target='_blank'>Unterschrift anzeigen</a>";
        } else {
            resultEl.innerHTML = "<b>Fehler:</b><br>" + data.message;
        }

    })
    .catch(err => {
        resultEl.innerHTML = "<b>Upload fehlgeschlagen:</b><br>" + err;
    });
}
</script>

</body>
</html>
