<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leistungen</title>

<style>
body {
  font-family: Arial;
  margin: 10px;
  background: #f5f7fa;
}

h2 {
  text-align: center;
}

select, input, button {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  font-size: 16px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  background: #4CAF50;
  color: white;
  border: none;
}

.reset {
  background: #ccc;
  color: black;
}

.card {
  background: white;
  padding: 10px;
  margin: 10px 0;
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.small {
  color: gray;
  font-size: 12px;
}
</style>
</head>

<body>

<h2>Leistungen</h2>

<select id="klient"></select>
<select id="leistung"></select>

<select id="status">
  <option value="alle">Alle</option>
  <option value="offen">Offen</option>
  <option value="abgerechnet">Abgerechnet</option>
</select>

<input type="date" id="von">
<input type="date" id="bis">

<button onclick="loadLeistungen()">Filtern</button>
<button class="reset" onclick="resetFilter()">Zurücksetzen</button>

<div id="output"></div>

<script>

// 👉 DEINE SCRIPT-URL EINTRAGEN
const BASE_URL = "https://script.google.com/macros/s/AKfycbxkw8XrP2QEmffJf_bjRVLZ93BUPUyOzN8yuOvjwODyeKp4tCZ2GiJWcwL7OtmqMQLQRA/exec";

window.onload = () => {
  loadKlienten();
  loadLeistungen();
};

// =============================
// DROPDOWNS LADEN
// =============================
async function loadKlienten() {

  const res = await fetch(BASE_URL + "?action=getKlienten");
  const data = await res.json();

  const sel = document.getElementById("klient");
  sel.innerHTML = '<option value="">Alle Klienten</option>';

  data.forEach(k => {
    sel.innerHTML += `<option value="${k}">${k}</option>`;
  });
}

async function loadLeistungenDropdown() {

  // optional: statisch oder später dynamisch
  const list = [
    "Reittherapie",
    "Reitstunde",
    "Assistenz",
    "Coaching",
    "Sonstiges"
  ];

  const sel = document.getElementById("leistung");
  sel.innerHTML = '<option value="">Alle Leistungen</option>';

  list.forEach(l => {
    sel.innerHTML += `<option value="${l}">${l}</option>`;
  });
}

// =============================
// HAUPTFUNKTION
// =============================
async function loadLeistungen() {

  const klient = document.getElementById("klient").value;
  const leistung = document.getElementById("leistung").value;
  const status = document.getElementById("status").value;
  const von = document.getElementById("von").value;
  const bis = document.getElementById("bis").value;

  let url = `${BASE_URL}?action=getLeistungen`;

  if (klient) url += `&klient=${encodeURIComponent(klient)}`;
  if (leistung) url += `&leistung=${encodeURIComponent(leistung)}`;
  if (status) url += `&status=${status}`;
  if (von) url += `&von=${von}`;
  if (bis) url += `&bis=${bis}`;

  const res = await fetch(url);
  const data = await res.json();

  render(data);
}

// =============================
// ANZEIGE
// =============================
function render(data) {

  const out = document.getElementById("output");
  out.innerHTML = "";

  if (!data.length) {
    out.innerHTML = "<p>Keine Daten gefunden</p>";
    return;
  }

  data.forEach(d => {

    out.innerHTML += `
      <div class="card">
        <b>${d.datum} (${d.wochentag})</b><br>
        ${d.klient}<br>
        ${d.leistung}<br>
        <span class="small">
          ${d.reNr ? "Rechnung: " + d.reNr + " (" + d.reDatum + ")" : "Offen"}
        </span>
      </div>
    `;
  });
}

// =============================
// RESET
// =============================
function resetFilter() {

  document.getElementById("klient").value = "";
  document.getElementById("leistung").value = "";
  document.getElementById("status").value = "alle";
  document.getElementById("von").value = "";
  document.getElementById("bis").value = "";

  loadLeistungen();
}

// Initialisierung
loadLeistungenDropdown();

</script>

</body>
</html>
